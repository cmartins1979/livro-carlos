    <!-- Script de repasse de UTMs para Eduzz (Triwer) -->
    <script>
      (function() {
        function appendUtmsToUrl(urlStr) {
          if (!window.location.search) return urlStr;
          try {
            const url = new URL(urlStr, window.location.origin);
            const currentParams = new URLSearchParams(window.location.search);
            currentParams.forEach((value, key) => {
              url.searchParams.set(key, value);
            });
            return url.toString();
          } catch (e) {
            return urlStr;
          }
        }

        function updateEduzzLinks() {
          if (!window.location.search) return;
          var links = document.querySelectorAll('a');
          links.forEach(function(item) {
            if (item.href && item.href.indexOf('sun.eduzz.com') !== -1) {
              item.href = appendUtmsToUrl(item.href);
            }
          });
        }

        // 1. Atualiza nos eventos de carregamento
        window.addEventListener('DOMContentLoaded', updateEduzzLinks);
        window.addEventListener('load', updateEduzzLinks);

        // 2. Interceptor de clique (garante 100% mesmo com componentes dinâmicos do React)
        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && link.href && link.href.indexOf('sun.eduzz.com') !== -1) {
            link.href = appendUtmsToUrl(link.href);
          }
        }, true);

        // 3. Observa novas renderizações do React no DOM
        if (window.MutationObserver) {
          var observer = new MutationObserver(function() {
            updateEduzzLinks();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }

        console.log('%cScript de rastreamento de vendas desenvolvido pela Triwer 🚀', 'font-size:16px;color:gold;');
      })();
    </script>
